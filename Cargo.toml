# Cargo.toml da CodeNomad Academy: 50 sources de Rust, um binário por arquivo.
# Nenhuma dependência. Cada source também compila sozinha com rustc, sem Cargo.
# Uso: cargo run --release --bin <nome_sem_numero> -- --demo

[package]
name = "codenomad-rust-sources"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "50 programas de Rust, um por arquivo, só biblioteca padrão. Um projeto da CodeNomad Academy (codenomad.org)."
license = "MIT"
publish = false
autobins = false

[dependencies]

[[bin]]
name = "calculadora_juros_compostos"
path = "sources/01_calculadora_juros_compostos.rs"

